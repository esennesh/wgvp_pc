# schedule_free_adamw with gradient-spike control + a NaN guard.
# Chained via optax.chain(*optim.values()) in the Para monad: transform1 clips
# the global grad norm (caps occasional CV-remainder spikes), transform2 wraps
# the optimizer in apply_if_finite so any step whose (clipped) gradient is still
# non-finite is skipped rather than poisoning the params. Set learning_rate to
# match your run; raise max_consecutive_errors if isolated skips aren't enough.
transform1:
  _target_: optax.clip_by_global_norm
  max_norm: 500
transform2:
  _target_: optax.apply_if_finite
  inner:
    _target_: optax.contrib.schedule_free_adamw
    learning_rate: 1e-4
  max_consecutive_errors: 5
