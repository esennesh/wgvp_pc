# @package _global_

defaults:
  - override /guide: pvae
  - override /model: pvae

monad:
  optim:
    _target_: optax.contrib.schedule_free_adamw
    learning_rate: 2e-3
  scheduler:
    _target_: optax.contrib.reduce_on_plateau
    accumulation_size: 1
    cooldown: 20
    factor: 0.5
    min_scale: 0.025
    patience: 5
    rtol: 1e-4
  tracer:
    _target_: src.inference.graphical.ELBOTracer
    num_particles: 8
