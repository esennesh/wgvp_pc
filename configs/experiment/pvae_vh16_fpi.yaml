# @package _global_

defaults:
  - override /data: vh16
  - override /guide: pvae_fpi
  - override /model: pvae_vh16

guide:
  dynamics:
    x_dim: 256
    z_dim: 512

model:
  scale: null

monad:
  optim:
    _target_: optax.contrib.schedule_free_adamw
    learning_rate: 8e-5
  scheduler:
    _target_: optax.contrib.reduce_on_plateau
    accumulation_size: 1
    cooldown: 20
    factor: 0.5
    min_scale: 0.025
    patience: 5
    rtol: 1e-4
  tracer:
    num_particles: 8

trainer:
  epochs: 4000
  save_period: 1000
